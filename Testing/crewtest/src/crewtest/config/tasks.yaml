random_numbers_task:
  description: >
    Generate two random integers between 1 and 100 and return them in a
    machine-friendly format (two whitespace-separated integers). Then use the
    provided tool to use the numbers to create a third integer. Output all three numbers
  expected_output: >
    The task should output exactly three whitespace-separated integers: the
    first random number, the second random number, and the third number created with the secret_calculation_tool.
  agent: random_agent
  tools:
    - secret_calculation_tool