[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend skeleton for the Requirements-LLM project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "fastembed>=0.3",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
